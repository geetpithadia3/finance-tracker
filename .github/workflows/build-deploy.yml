name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    # Previous build job remains the same...

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Prod
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            
            # Create environment file
            cat > .env << EOF
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            DB_HOST=${{ env.DB_HOST }}
            DB_PORT=${{ env.DB_PORT }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            EOF
            
            # Pull and run the new image
            docker pull ghcr.io/${{ github.repository }}/your-image-name:latest
            docker stop tracker || true
            docker rm tracker || true
            docker run -d \
              --name tracker \
              -p 8080:8080 \
              --env-file .env \
              --health-cmd="curl -f http://localhost:8080/actuator/health || exit 1" \
              --health-interval=30s \
              --health-timeout=10s \
              --health-retries=3 \
              --health-start-period=60s \
              --restart unless-stopped \
              ghcr.io/${{ github.repository }}/your-image-name:latest
            
            # Wait for container to be healthy
            echo "Waiting for container to be healthy..."
            timeout 300 bash -c 'while [[ "$(docker inspect -f {{.State.Health.Status}} tracker)" != "healthy" ]]; do sleep 5; done'
            
            # Check final status
            if [ "$(docker inspect -f {{.State.Health.Status}} tracker)" = "healthy" ]; then
              echo "Container is healthy"
            else
              echo "Container failed to become healthy"
              docker logs tracker
              exit 1
            fi
name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Prod
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build Docker image
        id: build_image
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}:latest"
          docker build \
            --build-arg JWT_SECRET=${{ secrets.JWT_SECRET }} \
            --build-arg DB_HOST=${{ env.DB_HOST }} \
            --build-arg DB_PORT=${{ env.DB_PORT }} \
            --build-arg DB_NAME=${{ env.DB_NAME }} \
            --build-arg DB_USER=${{ env.DB_USER }} \
            --build-arg DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            -t $IMAGE_NAME .
          echo "image=$IMAGE_NAME" >> $GITHUB_OUTPUT
      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push Docker image to GHCR
        run: |
          docker push ${{ steps.build_image.outputs.image }}


  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: Prod
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            
            # Create environment file
            cat > .env << EOF
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            DB_HOST=${{ env.DB_HOST }}
            DB_PORT=${{ env.DB_PORT }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            EOF
            
            # Pull the new image
            IMAGE_NAME="ghcr.io/${{ github.repository }}:latest"
            docker pull $IMAGE_NAME
            
            # Stop and remove the existing container if it exists
            docker stop tracker || true
            docker rm tracker || true
            
            # Run the new container
            docker run -d \
              --name tracker \
              -p 8080:8080 \
              --env-file .env \
              --health-cmd="curl -f http://localhost:8080/actuator/health || exit 1" \
              --health-interval=30s \
              --health-timeout=10s \
              --health-retries=3 \
              --health-start-period=60s \
              --restart unless-stopped \
              $IMAGE_NAME
            
            # Wait for container to be healthy
            echo "Waiting for container to be healthy..."
            timeout 300 bash -c 'while [[ "$(docker inspect -f {{.State.Health.Status}} tracker)" != "healthy" ]]; do sleep 5; done'
            
            # Check final status
            if [ "$(docker inspect -f {{.State.Health.Status}} tracker)" = "healthy" ]; then
              echo "Container is healthy"
            else
              echo "Container failed to become healthy"
              docker logs tracker
              exit 1
            fi